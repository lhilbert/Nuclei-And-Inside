[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antenna3d"
version = "0.1.0"
description = "Nuclear F-actin antenna networks from .nd2 z-stacks, as one graph per nucleus"
requires-python = ">=3.11"
dependencies = [
  "nd2", "numpy", "scipy", "scikit-image", "networkx", "skan", "pandas", "tifffile",
  "matplotlib",
]

[project.optional-dependencies]
# Only needed if you let this package segment nuclei itself. The intended path is to pass
# labels you already have, in which case neither of these is installed or imported.
cellpose = ["cellpose>=4.0", "torch"]
# Parquet alongside the CSVs. The edge table is mostly `polyline`; parquet is ~10x smaller.
parquet = ["pyarrow"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["antenna3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_data: requires .nd2 files; set ANTENNA3D_TEST_ND2 to a file or folder"]
